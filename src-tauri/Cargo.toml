[package]
name = "jason-os"
version = "0.1.0"
description = "Local-first personal operating system"
authors = ["Jason OS"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
rusqlite = { version = "0.38", features = ["bundled"] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }

[features]
webdriver = ["dep:tauri-plugin-wdio-webdriver"]
